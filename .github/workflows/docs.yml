# TEMPLATE — create-country docs-site scaffold.
# Destination: .github/workflows/docs.yml (this file is copied out of docs/ into
# .github/workflows/ — it does not stay inside docs/ itself).
# No substitution needed, and identical for every repo including mcp-einvoicing-core: the
# canonical docs-theme.css lives only in mcp-einvoicing-core (public), and every other repo's
# package.json fetches it automatically via a predev/prebuild hook before `npm run build`
# ever runs here — see docs-site-template.md's "Theme (single source, not copied)" section.
# There is nothing to substitute or keep in sync in this file.
# Delete this comment block after copying.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "README*"
      - "docs/**"
      - "CHANGELOG.md"
      - "src/**/tools/**"
      - "src/**/server.py"
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Upgrade npm
        # The npm bundled with actions/setup-node's Node 22 image has a bug validating
        # optional peer dependencies during `npm ci` (starlight-llms-txt nests an older
        # @astrojs/mdx whose optional peer on @astrojs/markdown-satteri trips it up),
        # confirmed during the mcp-einvoicing-core/mcp-einvoicing-be pilot rollout. npm 11
        # (verified locally) does not have this bug.
        run: npm install -g npm@11

      - name: Set up Python
        # tomllib (used by scripts/gen_llms_txt.py) is stdlib only from 3.11+.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Regenerate llms.txt
        working-directory: docs
        run: python3 scripts/gen_llms_txt.py

      - name: Build
        # For every repo except mcp-einvoicing-core, this run's own `prebuild` npm hook
        # fetches the canonical docs-theme.css from mcp-einvoicing-core before Astro builds.
        working-directory: docs
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
