[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-einvoicing-in"
version = "0.2.1"
description = "MCP server for India GST e-invoicing (FORM GST INV-01 schema v1.1 / IRP-IRN), vendor-neutral, GSP-agnostic build"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Christophe Mendez" }]
keywords = ["mcp", "e-invoicing", "india", "gst", "gstin", "irp", "irn", "einvoice1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp-einvoicing-core[qr]>=1.32.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_einvoicing_in"]

[tool.ruff]
line-length = 100
target-version = "py311"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "lxml-stubs>=0.5.0",
    "pre-commit>=4.5.1",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
